name: Compilar ejecutable Windows (.exe)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar en Windows
    runs-on: windows-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compilar con build.py
        run: |
          python build.py

      - name: Verificar que el ejecutable existe
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/AbrirCajon.exe")) {
            Write-Error "No se encontró dist/AbrirCajon.exe"
            exit 1
          }
          Write-Host "✅ dist/AbrirCajon.exe generado exitosamente."

      - name: Crear archivo ZIP con el ejecutable y configuración
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath AbrirCajon-Windows.zip -Force
          Write-Host "✅ AbrirCajon-Windows.zip creado."

      - name: Subir artefacto (carpeta dist)
        uses: actions/upload-artifact@v4
        with:
          name: AbrirCajon-Windows
          path: dist/
          retention-days: 30

      - name: Subir artefacto (archivo ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: AbrirCajon-ZIP
          path: AbrirCajon-Windows.zip
          retention-days: 30

      - name: Publicar Release en GitHub (al crear un Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AbrirCajon.exe
            AbrirCajon-Windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
